suite: labels
templates:
  - attacher-rbac.yaml
  - controllerserver.yaml
  - controllerserverroles.yaml
  - csiaddons-rbac.yaml
  - driver.yaml
  - iboxcg-controller-rbac.yaml
  - iboxpromote-controller-rbac.yaml
  - iboxreplica-controller-rbac.yaml
  - nodeserver.yaml
  - nodeserverroles.yaml
  - protocol-secret.yaml
  - provisioner-rbac.yaml
  - resizer-rbac.yaml
  - secret-infinibox.yaml
  - volumegroup-rbac.yaml
release:
  name: t
  namespace: ibox
tests:
  - it: adds commonLabels to every resource
    set:
      installCSIAddons: true
      e2etesting: "true"
      commonLabels:
        team: storage
        env: prod
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            team: storage
            env: prod

  - it: renders no labels on unlabeled resources by default
    templates:
      - attacher-rbac.yaml
      - driver.yaml
      - nodeserverroles.yaml
    asserts:
      - notExists:
          path: metadata.labels

  - it: keeps the chart app label on credential secrets
    template: secret-infinibox.yaml
    set:
      commonLabels:
        app: overridden
        team: storage
    asserts:
      - equal:
          path: metadata.labels
          value:
            app: infinidat-csi-driver
            team: storage

  - it: keeps the chart app label on protocol secrets
    template: protocol-secret.yaml
    set:
      commonLabels:
        app: overridden
    asserts:
      - equal:
          path: metadata.labels.app
          value: infinidat-csi-driver-protocol-secret

  - it: merges podLabels and commonLabels into controller pods without touching the selector
    template: controllerserver.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    set:
      commonLabels:
        app: overridden
        team: storage
      controllerserver:
        podLabels:
          app: overridden
          tier: controller
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app: t-driver
            team: storage
            tier: controller
      - equal:
          path: spec.selector.matchLabels
          value:
            app: t-driver

  - it: merges podLabels and commonLabels into node pods without touching the selector
    template: nodeserver.yaml
    documentSelector:
      path: kind
      value: DaemonSet
    set:
      commonLabels:
        team: storage
      nodeserver:
        podLabels:
          app: overridden
          tier: node
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app: t-node
            team: storage
            tier: node
      - equal:
          path: spec.selector.matchLabels
          value:
            app: t-node

  - it: podLabels take precedence over commonLabels
    template: nodeserver.yaml
    documentSelector:
      path: kind
      value: DaemonSet
    set:
      commonLabels:
        tier: common
      nodeserver:
        podLabels:
          tier: node
    asserts:
      - equal:
          path: spec.template.metadata.labels.tier
          value: node

  - it: labels every credential secret
    template: secret-infinibox.yaml
    set:
      commonLabels:
        team: storage
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.labels
          value:
            app: infinidat-csi-driver
            team: storage

  - it: podLabels alone work without commonLabels
    template: controllerserver.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    set:
      controllerserver:
        podLabels:
          tier: controller
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app: t-driver
            tier: controller
      - notExists:
          path: metadata.labels

  - it: controller podLabels do not leak into node pods
    template: nodeserver.yaml
    documentSelector:
      path: kind
      value: DaemonSet
    set:
      controllerserver:
        podLabels:
          tier: controller
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app: t-node

  - it: renders string label values quoted
    template: driver.yaml
    set:
      commonLabels:
        enabled: "true"
        version: "123"
    asserts:
      - equal:
          path: metadata.labels.enabled
          value: "true"
      - equal:
          path: metadata.labels.version
          value: "123"

  - it: quotes bool, int and float commonLabels values on every resource
    templates:
      - attacher-rbac.yaml
      - driver.yaml
      - nodeserverroles.yaml
      - protocol-secret.yaml
      - secret-infinibox.yaml
    set:
      commonLabels:
        enabled: true
        disabled: false
        count: 123
        ratio: 1.5
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            enabled: "true"
            disabled: "false"
            count: "123"
            ratio: "1.5"

  - it: drops null label values on every resource and pod
    templates:
      - attacher-rbac.yaml
      - controllerserver.yaml
      - nodeserver.yaml
      - protocol-secret.yaml
      - secret-infinibox.yaml
    set:
      commonLabels:
        team: storage
        removed: null
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            team: storage
      - notExists:
          path: metadata.labels.removed

  - it: quotes bool and int podLabels values on controller pods
    template: controllerserver.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    set:
      commonLabels:
        enabled: true
      controllerserver:
        podLabels:
          count: 7
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app: t-driver
            enabled: "true"
            count: "7"
      - equal:
          path: metadata.labels
          value:
            enabled: "true"

  - it: quotes bool and int podLabels values on node pods
    template: nodeserver.yaml
    documentSelector:
      path: kind
      value: DaemonSet
    set:
      commonLabels:
        enabled: true
      nodeserver:
        podLabels:
          count: 7
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app: t-node
            enabled: "true"
            count: "7"
