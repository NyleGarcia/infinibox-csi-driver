apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ required "Provide CSI Driver Name"  .Values.csiDriverName }}
  {{- with $.Values.commonLabels }}
  labels:
    {{- include "infinibox-csi-driver.labels" . | nindent 4 }}
  {{- end }}
spec:
  attachRequired: true
  podInfoOnMount: true
  fsGroupPolicy: File
